# Runs the capstone's tests on the fork's own branches, including the browser
# tests, and fails if any test is skipped. The lab's python-app.yml (main only)
# is left as it is.
name: Capstone tests

on:
  push:
    branches: [ "capstone", "scoring-*", "mandarin-*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install (everything except Whisper)
      run: |
        python -m pip install --upgrade pip
        pip install Flask absl-py numpy pandas scipy matplotlib seaborn pytest jieba playwright
        python -m playwright install --with-deps chromium
    - name: Test, and fail on any skip
      run: |
        set -o pipefail
        pytest -rs --ignore=asr_test.py --ignore=offline_asr_test.py \
          --ignore=offline_asr_whisper_test.py | tee pytest.log
        if grep -qE "[0-9]+ skipped" pytest.log; then
          echo "::error::some tests were skipped"; exit 1
        fi
